<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClawBrow Suggestion</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./picker.css" />
    <link rel="stylesheet" href="./result.css" />
    <script defer src="../../dist/renderer/picker-actions.js"></script>
    <script defer src="../../dist/renderer/renderer.js"></script>
  </head>
  <body data-view="suggestion" data-state="picker">
    <main class="suggestion-shell" aria-live="polite">
      <section class="suggestion-card" aria-label="ClawBrow からの提案">
        <header class="suggestion-topbar">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true"></span>
            <p class="brand-name">ClawBrow</p>
          </div>
          <div class="window-actions" aria-label="ウィンドウ操作">
            <button type="button" class="icon-button" id="top-compact" aria-label="小さくする">
              <svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/><path d="M9 9h6v6H9z"/></svg>
            </button>
            <button type="button" class="icon-button" id="top-close" aria-label="閉じる">
              <svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>
        </header>

        <div class="state-picker" data-state-show="picker">
          <section class="hero">
            <div class="headline-row">
              <h1 id="headline" class="headline">次の方向性を考えています…</h1>
              <span class="headline-pulse" aria-hidden="true"></span>
            </div>
            <p id="hint" class="hint">Claude Code に提案を聞いています</p>
            <form class="picker-note-form" id="picker-note-form" autocomplete="off">
              <input
                type="text"
                id="picker-note-input"
                class="picker-note-input"
                maxlength="240"
                placeholder="状況を一言（任意）— Enterで再生成"
                aria-label="補助メモ"
              />
            </form>
          </section>

          <ul id="actions" class="action-list" role="list">
            <li class="action-skeleton" aria-hidden="true">
              <span class="skeleton-line"></span>
            </li>
            <li class="action-skeleton" aria-hidden="true">
              <span class="skeleton-line"></span>
            </li>
            <li class="action-skeleton" aria-hidden="true">
              <span class="skeleton-line"></span>
            </li>
          </ul>

          <footer class="suggestion-actions">
            <p id="suggestion-status" class="status" role="status"></p>
            <div class="button-row">
              <button type="button" class="ghost-button" data-feedback="wrong">
                <svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg>
                <span>違う</span>
              </button>
              <button type="button" class="ghost-button" data-feedback="retry">
                <svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                <span>再提案</span>
              </button>
              <button type="button" class="icon-button corner-icon-button" data-action="settings" aria-label="設定">
                <svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </footer>
        </div>

        <div class="state-result" data-state-show="result">
          <div class="selected-chip" id="selected-chip">
            <span class="chip-label">選択中</span>
            <span class="chip-text" id="selected-label"></span>
          </div>

          <div class="thread" id="thread"></div>

          <form class="thread-form" id="thread-form">
            <textarea
              id="thread-input"
              rows="1"
              maxlength="600"
              placeholder="追加で聞きたいことを入力…"
            ></textarea>
            <button type="submit" class="thread-send" aria-label="送信">
              <svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            </button>
          </form>

          <p id="result-status" class="status" role="status"></p>

          <footer class="result-actions">
            <div class="result-actions-row">
              <button type="button" class="ghost-button" data-result-action="terminal">
                <svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></svg>
                <span>ターミナルで開く</span>
              </button>
              <button type="button" class="ghost-button" data-result-action="reroll">
                <svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg>
                <span>別案をもらう</span>
              </button>
              <button type="button" class="icon-button corner-icon-button" data-action="settings" aria-label="設定">
                <svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </footer>
        </div>
      </section>
    </main>
  </body>
</html>
