<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>プロンプト編集 — ClawBrow</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./prompts.css" />
    <script defer src="../../dist/renderer/prompts.js"></script>
  </head>
  <body data-view="prompts">
    <main class="note-shell">
      <form id="prompts-form" class="note-panel prompts-panel" aria-label="プロンプトを編集">
        <header class="note-header">
          <div>
            <p class="eyebrow">ClawBrow</p>
            <h1>プロンプト編集</h1>
          </div>
          <button type="button" id="prompts-close" class="icon-button" aria-label="閉じる">
            <svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </header>

        <div class="prompts-tabs" role="tablist">
          <button
            type="button"
            role="tab"
            class="prompts-tab is-active"
            data-tab="picker"
            aria-selected="true"
          >
            3提案プロンプト
          </button>
          <button
            type="button"
            role="tab"
            class="prompts-tab"
            data-tab="direction"
            aria-selected="false"
          >
            追加質問プロンプト
          </button>
        </div>

        <textarea
          id="prompt-textarea"
          class="prompts-textarea"
          spellcheck="false"
          placeholder="読み込み中…"
        ></textarea>

        <p class="prompts-help" id="prompts-help">
          利用可能な変数: <code>{{screenshotPath}}</code> <code>{{triggerId}}</code> <code>{{noteBlock}}</code>
        </p>

        <footer class="note-actions prompts-footer">
          <p id="prompts-status" class="status" role="status"></p>
          <div class="button-row">
            <button type="button" id="prompts-reset" class="ghost-button">デフォルトに戻す</button>
            <button type="button" id="prompts-cancel" class="ghost-button">キャンセル</button>
            <button type="submit" id="prompts-save" class="primary-button">保存</button>
          </div>
        </footer>
      </form>
    </main>
  </body>
</html>
