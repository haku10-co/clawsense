<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClawBrow にメモを追加</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="../../dist/renderer/note.js"></script>
  </head>
  <body data-view="note">
    <main class="note-shell">
      <form id="note-form" class="note-panel" aria-label="メモを添えて ClawBrow に聞く">
        <header class="note-header">
          <div>
            <p class="eyebrow">ClawBrow</p>
            <h1>補足を追加</h1>
          </div>
        </header>

        <label class="note-label" for="note-input">メモ（任意）</label>
        <textarea
          id="note-input"
          name="note"
          rows="4"
          maxlength="600"
          placeholder="状況や試したことを入力してください…"
        ></textarea>

        <footer class="note-actions">
          <p id="note-status" class="status" role="status"></p>
          <div class="button-row">
            <button id="cancel-note" type="button" class="ghost-button">キャンセル</button>
            <button type="submit" class="primary-button">ClawBrow に聞く</button>
          </div>
        </footer>
      </form>
    </main>
  </body>
</html>
